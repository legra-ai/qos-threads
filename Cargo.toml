[package]
name = "qos-threads"
version = "0.1.3"
edition = "2024"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Cross-platform QoS controls; native scheduling on macOS, Linux, and Android"
repository = "https://github.com/legra-ai/qos-threads"
homepage = "https://github.com/legra-ai/qos-threads"
documentation = "https://docs.rs/qos-threads"
keywords = ["qos", "threads", "scheduling", "priority", "macos"]
categories = ["os", "os::unix-apis"]
readme = "README.md"

[lib]
doctest = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
